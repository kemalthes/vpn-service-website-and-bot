databaseChangeLog:
  - changeSet:
      id: 37-add-subscription-device-limits
      author: codex
      changes:
        - sql:
            sql: |
              ALTER TABLE tokens
                ADD COLUMN IF NOT EXISTS max_devices INT NOT NULL DEFAULT 3,
                ADD COLUMN IF NOT EXISTS renewal_target_max_devices INT;

              ALTER TABLE tokens
                DROP CONSTRAINT IF EXISTS ch_tokens_max_devices;

              ALTER TABLE tokens
                ADD CONSTRAINT ch_tokens_max_devices
                CHECK (
                  max_devices > 0
                  AND (renewal_target_max_devices IS NULL OR renewal_target_max_devices > 0)
                );

        - sql:
            sql: |
              ALTER TABLE vpn_plans
                ADD COLUMN IF NOT EXISTS default_devices INT NOT NULL DEFAULT 3;

              ALTER TABLE vpn_plans
                DROP CONSTRAINT IF EXISTS ch_vpn_plans_default_devices;

              ALTER TABLE vpn_plans
                ADD CONSTRAINT ch_vpn_plans_default_devices
                CHECK (default_devices > 0);

        - sql:
            sql: |
              ALTER TABLE orders
                ADD COLUMN IF NOT EXISTS token_id BIGINT,
                ADD COLUMN IF NOT EXISTS operation_type VARCHAR(32),
                ADD COLUMN IF NOT EXISTS target_max_devices INT,
                ADD COLUMN IF NOT EXISTS total_price NUMERIC(12, 0),
                ADD COLUMN IF NOT EXISTS updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW();

              ALTER TABLE orders
                DROP CONSTRAINT IF EXISTS fk_orders_token;

              ALTER TABLE orders
                ADD CONSTRAINT fk_orders_token
                FOREIGN KEY (token_id) REFERENCES tokens(id);

              UPDATE orders
              SET operation_type = CASE
                  WHEN vpn_plan_id = 4 THEN 'NEW_SUBSCRIPTION'
                  WHEN vpn_plan_id IN (5, 6) THEN 'LUCKY_777_BONUS'
                  ELSE 'SUBSCRIPTION_RENEWAL'
              END
              WHERE operation_type IS NULL;

              ALTER TABLE orders
                ALTER COLUMN operation_type SET NOT NULL;

              ALTER TABLE orders
                ALTER COLUMN vpn_plan_id DROP NOT NULL;

              ALTER TABLE orders
                DROP CONSTRAINT IF EXISTS ch_orders_operation_type;

              ALTER TABLE orders
                ADD CONSTRAINT ch_orders_operation_type
                CHECK (operation_type IN (
                  'NEW_SUBSCRIPTION',
                  'SUBSCRIPTION_RENEWAL',
                  'DEVICE_LIMIT_CHANGE',
                  'LUCKY_777_BONUS',
                  'AUTO_RENEWAL'
                ));

              ALTER TABLE orders
                DROP CONSTRAINT IF EXISTS ch_orders_target_max_devices;

              ALTER TABLE orders
                ADD CONSTRAINT ch_orders_target_max_devices
                CHECK (target_max_devices IS NULL OR target_max_devices > 0);

              ALTER TABLE orders
                DROP CONSTRAINT IF EXISTS ch_orders_total_price;

              ALTER TABLE orders
                ADD CONSTRAINT ch_orders_total_price
                CHECK (total_price IS NULL OR total_price >= 0);

              ALTER TABLE orders
                DROP CONSTRAINT IF EXISTS ch_orders_status;

              ALTER TABLE orders
                ADD CONSTRAINT ch_orders_status
                CHECK (status IN ('DRAFT', 'PENDING', 'PAID', 'CANCELLED', 'PROVIDED'));

        - sql:
            sql: |
              CREATE UNIQUE INDEX IF NOT EXISTS uq_orders_user_operation_draft
                ON orders (user_id, operation_type)
                WHERE status = 'DRAFT';

        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS subscription_device_settings (
                id SMALLINT PRIMARY KEY DEFAULT 1,
                price_per_device_month NUMERIC(12, 2) NOT NULL,
                max_devices_limit INT NOT NULL DEFAULT 20,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                CONSTRAINT ch_subscription_device_settings_single_row CHECK (id = 1),
                CONSTRAINT ch_subscription_device_settings_values CHECK (
                  price_per_device_month >= 0
                  AND max_devices_limit > 0
                )
              );

              INSERT INTO subscription_device_settings (id, price_per_device_month, max_devices_limit)
              VALUES (1, 30, 20)
              ON CONFLICT (id) DO NOTHING;

  - changeSet:
      id: 38-add-order-operation-payload-constraint
      author: codex
      changes:
        - sql:
            sql: |
              ALTER TABLE orders
                DROP CONSTRAINT IF EXISTS ch_orders_operation_payload;

              ALTER TABLE orders
                ADD CONSTRAINT ch_orders_operation_payload
                CHECK (
                  (
                    operation_type = 'NEW_SUBSCRIPTION'
                    AND token_id IS NULL
                    AND vpn_plan_id IS NOT NULL
                    AND target_max_devices IS NOT NULL
                    AND total_price IS NOT NULL
                  )
                  OR (
                    operation_type = 'SUBSCRIPTION_RENEWAL'
                    AND token_id IS NOT NULL
                    AND target_max_devices IS NOT NULL
                    AND (
                      (
                        status = 'DRAFT'
                        AND (
                          (vpn_plan_id IS NULL AND total_price IS NULL)
                          OR (vpn_plan_id IS NOT NULL AND total_price IS NOT NULL)
                        )
                      )
                      OR (
                        status <> 'DRAFT'
                        AND vpn_plan_id IS NOT NULL
                        AND total_price IS NOT NULL
                      )
                    )
                  )
                  OR (
                    operation_type = 'DEVICE_LIMIT_CHANGE'
                    AND token_id IS NOT NULL
                    AND vpn_plan_id IS NULL
                    AND target_max_devices IS NOT NULL
                    AND total_price IS NOT NULL
                  )
                  OR (
                    operation_type = 'LUCKY_777_BONUS'
                    AND token_id IS NOT NULL
                    AND vpn_plan_id IS NOT NULL
                    AND target_max_devices IS NOT NULL
                    AND total_price IS NOT NULL
                  )
                  OR (
                    operation_type = 'AUTO_RENEWAL'
                    AND token_id IS NOT NULL
                    AND vpn_plan_id IS NOT NULL
                    AND target_max_devices IS NOT NULL
                    AND total_price IS NOT NULL
                  )
                ) NOT VALID;
